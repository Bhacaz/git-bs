name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos-x86_64
            triple: x86_64-apple-darwin
          - runner: ubuntu-24.04
            platform: linux-x86_64
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify runner architecture
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.triple }}"
      - name: Build and test
        run: |
          cargo test --locked
          cargo build --release --locked
          target/release/git-bs --version
      - name: Package executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p assets
          tar -czf "assets/git-bs-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz" -C target/release git-bs
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: assets/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS \
            --verify-tag --title "git-bs $GITHUB_REF_NAME" --generate-notes
